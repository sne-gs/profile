name: Build and deploy resume

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: codeberg-small
    steps:
      - name: Checkout
        uses: https://data.forgejo.com/actions/checkout@v4

      - name: Install WeasyPrint
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            python3 python3-venv \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libffi8 fontconfig fonts-dejavu-core
          python3 -m venv /tmp/weasyprint
          /tmp/weasyprint/bin/pip install --quiet weasyprint
          echo "/tmp/weasyprint/bin" >> "$GITHUB_PATH"

      - name: Build site and PDFs
        run: ./build.sh

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create snegs-resume --production-branch=main || true
          npx --yes wrangler@4 pages deploy --branch=main --commit-dirty=true
